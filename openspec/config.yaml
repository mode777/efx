schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Tech stack: C11 core (ADR 0001) rendering via Sokol — fixed-function
  consumer API, no script-visible shaders ever (internals use Sokol's
  programmable pipeline with engine-owned canned shaders, ADR 0015);
  quickjs-ng embedded as the ES6
  runtime (ADR 0002, no quickjs-libc); Emscripten bridge for the browser.
  CMake build for Windows/Linux/macOS/Emscripten; output is a single
  `efx` player binary for a resource root with a `main.js` entry. GitHub
  Actions is the four-target gate (CMake build + ctest smoke suite,
  ADR 0009).

  Domain: EFX is a fixed-function renderer with an embedded ES6
  scripting layer. Immediate-mode JS API on one global `efx` object
  (ADR 0004); rendering goes through a re-orderable display list; fixed
  limits: 4 point lights + 1 directional light, 1 camera. Game scripts
  are pure ES6 with zero browser/Node dependencies, even transitively
  (Node is a test launcher only, ADR 0008).

  Doc map: vision.md (product goals), docs/js-api.md (script-facing API
  design guidelines), docs/api/ (generated per-symbol reference — regenerate
  from gallery/src/api/efx.d.ts via `npm --prefix gallery run docs:markdown`),
  docs/decisions/ (ADRs — the durable why behind cross-cutting
  invariants). openspec/specs/ pin required behavior; docs hold
  invariants and rationale; AGENTS.md points rather than restates.

  The roadmap is complete: milestones F1–F14 are implemented and gated
  on all four targets (openspec/specs/feature-roadmap). Post-roadmap
  proposals name the capability spec(s) under openspec/specs/ they
  modify or create; docs/tooling changes may set skip_specs. Behavior
  changes still cross the four-target verification gate (ADR 0020),
  dispatched per the ADR 0023 trigger policy.

# Per-artifact rules (optional)
rules:
  proposal:
    - Name the capability spec(s) this change modifies or creates, or set
      `skip_specs` for docs/tooling changes
    - Name the affected docs (js-api.md guidelines, docs/api reference,
      decisions) and state explicitly whether an ADR is needed ("No ADR —
      reason" vs "new ADR docs/decisions/NNNN")
    - State explicitly what is out of scope (Non-goals)
  tasks:
    - When the change settles a durable architecture decision, include an
      explicit task to write the ADR (docs/decisions/NNNN per TEMPLATE.md) and
      add it to the docs/decisions/README.md index
    - Include a docs update task whenever invariants, the script-facing API
      (docs/js-api.md and the generated docs/api reference), or the agent
      guidance in AGENTS.md change
    - Include a verification task naming the applicable harness (ctest
      suites, the golden-image harness, or docs validation such as
      `openspec validate --strict`)
  design:
    - Record rejected alternatives with the reason they lost
    - State how unmanaged resources are exposed to scripts: dynamic-count resources as
        GC-finalized opaque classes with explicit destroy() (ADR 0011, memory
        discipline ADR 0012); fixed banks (lights) as pre-allocated slots

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - If a durable decision is settled during apply that the proposal did not
        anticipate, record it in the design doc and note whether an ADR must
        follow before archive
  archive:
    guidance:
      - Before archiving, confirm any ADR the change promised is written in
        docs/decisions/ and indexed in docs/decisions/README.md
githubCopilot:
  cloudAgent: false

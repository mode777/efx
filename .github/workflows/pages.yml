name: pages

# Public sample gallery deployment (ADR 0023, amended by
# separate-pages-deploy; gallery embedding contract ADR 0030). Pages is
# deliberately NOT a job in the ci gate workflow: the github-pages
# environment only permits the default branch, so a gate run on a feature
# branch would fail on deploy and mask the verification result. This
# workflow owns build + deploy instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: deploy sample gallery (github pages)
    # manual dispatch from any other ref is a no-op (protected environment)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.64' # pinned consistently with the rest of CI

      - name: Build web player
        run: |
          emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --target player_web

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gallery/package-lock.json

      - name: Install gallery deps
        run: npm ci --prefix gallery

      - name: Bundle player into the gallery
        run: EFX_WEB_BUILD=build-web npm --prefix gallery run prepare:player

      - name: Build gallery
        run: npm --prefix gallery run build

      - name: Check gallery outputs
        run: |
          set -euo pipefail
          for f in index.html runner.html \
                   player/player_web.js player/player_web.wasm player/player_web.data; do
            test -f "gallery/dist/$f" || { echo "missing gallery/dist/$f" >&2; exit 1; }
          done

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gallery/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
